# Panel de administración (Sveltia CMS)
# Cada cambio que se guarda aquí se convierte en un commit al repo
# y Cloudflare Pages vuelve a publicar la página sola.

backend:
  name: github
  repo: LuisCuautzi/sombrerero-hermanos
  branch: main
  base_url: https://sombrerero-hermanos.pages.dev   # Cambiar si usan dominio propio
  auth_endpoint: api/auth                           # functions/api/auth.js
  commit_messages:
    create: "Nuevo producto: {{slug}}"
    update: "Editar producto: {{slug}}"
    delete: "Borrar producto: {{slug}}"
    uploadMedia: "Subir archivo: {{path}}"
    deleteMedia: "Borrar archivo: {{path}}"

# Dónde se guardan las fotos y con qué URL se ven en la página
media_folder: public/img/productos
public_folder: /img/productos

# Las fotos del celular se convierten solas a .webp y se achican
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 1600

# URLs sin acentos ni espacios: "Fuste Calendario Azteca" -> fuste-calendario-azteca
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: src/content/productos
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields: [orden, nombre, categoria]
    view_filters:
      - { label: Fustes, field: categoria, pattern: fustes }
      - { label: Espuelas, field: categoria, pattern: espuelas }
      - { label: Frenos, field: categoria, pattern: frenos }
      - { label: Hebillas, field: categoria, pattern: hebillas }
      - { label: Estribos, field: categoria, pattern: estribos }
      - { label: Otros, field: categoria, pattern: otros }
      - { label: Destacados, field: destacado, pattern: true }
    fields:
      - { label: Nombre, name: nombre, widget: string }
      - label: Categoría
        name: categoria
        widget: select
        options:
          - { label: Fustes, value: fustes }
          - { label: Espuelas, value: espuelas }
          - { label: Frenos, value: frenos }
          - { label: Hebillas, value: hebillas }
          - { label: Estribos, value: estribos }
          - { label: Otros, value: otros }
      - label: Fotos
        name: imagenes
        widget: list
        min: 1
        hint: "La primera foto es la portada. Arrastra para cambiar el orden."
        field: { label: Foto, name: foto, widget: image }
      - label: Video (opcional)
        name: video
        widget: file
        required: false
        media_folder: /public/video
        public_folder: /video
      - label: Resumen
        name: resumen
        widget: text
        hint: "Una o dos líneas. Sale en la tarjeta del catálogo y en Google."
      # Precio oculto por ahora. Para activarlo, descomentar:
      # - { label: Precio, name: precio, widget: string, required: false }
      - { label: Se puede personalizar, name: personalizable, widget: boolean, default: true }
      - { label: Destacado en el inicio, name: destacado, widget: boolean, default: false }
      - label: Orden
        name: orden
        widget: number
        value_type: int
        default: 100
        hint: "Número más chico = sale primero."
      - { label: Descripción, name: body, widget: markdown }

  - name: testimonios
    label: Clientes (testimonios)
    label_singular: Testimonio
    folder: src/content/testimonios
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · {{ciudad}}"
    sortable_fields: [orden, nombre]
    media_folder: /public/img/clientes
    public_folder: /img/clientes
    fields:
      - { label: Nombre del cliente, name: nombre, widget: string }
      - { label: Ciudad / Estado, name: ciudad, widget: string, required: false }
      - label: Foto del cliente o de su pieza
        name: foto
        widget: image
        required: false
        hint: "Pide permiso al cliente antes de publicar su foto."
      - label: Producto relacionado (opcional)
        name: producto
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
        required: false
      - { label: Comentario del cliente, name: body, widget: markdown }
      - { label: Publicado, name: publicado, widget: boolean, default: true }
      - { label: Mostrar en el inicio, name: destacado, widget: boolean, default: false }
      - { label: Orden, name: orden, widget: number, value_type: int, default: 100 }

  - name: configuracion
    label: Configuración
    files:
      - name: sitio
        label: Datos del sitio
        file: src/data/sitio.json
        format: json
        fields:
          - { label: Nombre corto (header del celular), name: nombreCorto, widget: string }
          - { label: Eslogan, name: eslogan, widget: string }
          - { label: Descripción (para Google), name: descripcion, widget: text }
          - label: WhatsApp
            name: whatsapp
            widget: string
            hint: "Con 52 al inicio, sin espacios ni signos. Ej: 5222XXXXXXXX"
            pattern: ['^52\d{10}$', 'Debe ser 52 seguido de 10 dígitos, sin espacios']
          - { label: Teléfono (como se muestra), name: telefono, widget: string }
          - { label: Correo, name: email, widget: string }
          - { label: Dirección, name: direccion, widget: text }
          - { label: Horario, name: horario, widget: string }
          - label: Mapa de Google (link para insertar)
            name: mapaEmbed
            widget: string
            required: false
            hint: "Google Maps → Compartir → Insertar un mapa → copia solo lo que va dentro de src=\"...\""
          - { label: Facebook, name: facebook, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: TikTok, name: tiktok, widget: string, required: false }
          - label: "¿Cómo pedir? (pasos)"
            name: comoPedir
            widget: list
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Texto, name: texto, widget: text }
          - label: Preguntas frecuentes (página de Contacto)
            name: preguntas
            widget: list
            summary: "{{fields.p}}"
            fields:
              - { label: Pregunta, name: p, widget: string }
              - { label: Respuesta, name: r, widget: text }
          - label: Nosotros
            name: nosotros
            widget: object
            fields:
              - label: Párrafos de la historia
                name: parrafos
                widget: list
                field: { label: Párrafo, name: parrafo, widget: text }
              - label: "Así trabajamos (pasos)"
                name: pasos
                widget: list
                fields:
                  - { label: Título, name: titulo, widget: string }
                  - { label: Texto, name: texto, widget: text }

      - name: categorias
        label: Categorías (textos)
        file: src/data/categorias.json
        format: json
        fields:
          - label: Categorías
            name: categorias
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{fields.nombre}}"
            fields:
              - { label: ID, name: id, widget: hidden }
              - { label: URL, name: slug, widget: hidden }
              - { label: Nombre corto, name: nombre, widget: string }
              - { label: Título de la página, name: titulo, widget: string }
              - { label: Descripción para Google, name: descripcion, widget: text, hint: "Máximo ~155 caracteres." }
              - label: Párrafos de introducción
                name: intro
                widget: list
                field: { label: Párrafo, name: parrafo, widget: text }
              - label: Preguntas frecuentes
                name: preguntas
                widget: list
                summary: "{{fields.p}}"
                fields:
                  - { label: Pregunta, name: p, widget: string }
                  - { label: Respuesta, name: r, widget: text }
              - { label: Mensaje de WhatsApp, name: whatsapp, widget: string }